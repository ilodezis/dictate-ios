name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build unsigned ipa
        env:
          DICTATE_BUNDLE_ID: ${{ vars.DICTATE_BUNDLE_ID }}
          DICTATE_APP_GROUP: ${{ vars.DICTATE_APP_GROUP }}
          DICTATE_VERSION: 0.1.${{ github.run_number }}
          DICTATE_BUILD: ${{ github.run_number }}
        run: |
          brew install xcodegen
          bash ios/ci-build.sh

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Unsigned build. Re-sign it on the device before installing."
          gh release upload latest ios/build/Dictate.ipa ios/build/source.json ios/build/icon.png --clobber
